<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu horizontal</title>

    <style>
        * {
            font-family: Verdana;
        }
        
        ul {
            list-style-type: none;
            overflow: hidden;
            background-color: #333;
        }
        
        li {
            float: left;
        }
        
        li.especial {
            float: right;
        }
        
        li a {
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        
        li a:hover {
            background-color: chocolate;
        }
    </style>
</head>

</body>
